  <style>
    :root {
      --bg: #0b0e1a;
      --panel: #121629;
      --neon: #00e5ff;
      --neon2: #ff2fb9;
      --text: #e6f1ff;
      --muted: #8b9bb4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #16204a 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    a.back { color: var(--neon); text-decoration: none; font-size: 14px; align-self: flex-start; margin-bottom: 12px; }
    a.back:hover { text-decoration: underline; }
    h1 { font-size: 26px; letter-spacing: 2px; text-shadow: 0 0 12px rgba(0, 229, 255, .6); }
    .sub { color: var(--muted); font-size: 13px; margin: 6px 0 18px; }
    .hud {
      display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;

    .diff { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; font-size: 14px; color: var(--muted); }

      touch-action: none;
      max-width: 100%;
    }

    button {
      background: transparent; color: var(--neon);

      margin-top: 16px; min-height: 24px; font-size: 15px;

    #msg.win { color: #58ffb1; text-shadow: 0 0 10px rgba(88, 255, 177, .5); }

<body>
  <a class="back" href="/">← 返回游戏合集</a>
  <h1>🌀 迷宫寻路 Maze</h1>
  <p class="sub">方向键 / WASD 移动（手机滑动）· 从左上走到右下 · 每局迷宫随机生成</p>

  <div class="hud">
    <span>步数 <b id="moves">0</b></span>
    <span>用时 <b id="time">0.0</b> 秒</span>
    <span>本档最佳步数 <b id="best">--</b></span>
  </div>

  <div class="diff" role="group" aria-label="选择迷宫尺寸">
    <span>尺寸：</span>
    <button data-n="11" class="on">11×11</button>
    <button data-n="15">15×15</button>
    <button data-n="21">21×21</button>
  </div>

  <canvas id="maze" width="460" height="460" aria-label="迷宫"></canvas>

  <div class="controls">
    <button id="btnNew">新迷宫</button>
  </div>

  <div id="msg" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";
      var N = 11;                     // 奇数格迷宫
      var CELL = 0;                   // 随 N 自适应
      var grid = [];                  // 1=墙 0=路
      var pr = 1, pc = 1;             // 玩家位置
      var moves = 0, playing = false;
      var timerId = null, startTime = 0;
      var trail = {};                 // 走过的格子（面包屑）

      var cv = document.getElementById("maze");
      var ctx = cv.getContext("2d");
      var elMoves = document.getElementById("moves");
      var elTime = document.getElementById("time");
      var elBest = document.getElementById("best");
      var elMsg = document.getElementById("msg");

      function bestKey() { return "maze_best_" + N; }

      function loadBest() {
        var b = "--";
        try { b = localStorage.getItem(bestKey()) || "--"; } catch (e) {}
        elBest.textContent = b;
      }

      /* ── DFS 回溯生成完美迷宫：奇数格，1 墙 0 路 ── */
      function generate() {
        grid = [];
        for (var r = 0; r < N; r++) {
          grid.push([]);
          for (var c = 0; c < N; c++) grid[r].push(1);
        }
        var stack = [[1, 1]];
        grid[1][1] = 0;
        var dirs = [[0, 2], [0, -2], [2, 0], [-2, 0]];
        while (stack.length) {
          var top = stack[stack.length - 1];
          var opts = [];
          for (var d = 0; d < 4; d++) {
            var nr = top[0] + dirs[d][0], nc = top[1] + dirs[d][1];
            if (nr > 0 && nr < N - 1 && nc > 0 && nc < N - 1 && grid[nr][nc] === 1) opts.push(dirs[d]);
          }
          if (!opts.length) { stack.pop(); continue; }
          var mv = opts[Math.floor(Math.random() * opts.length)];
          var mr = top[0] + mv[0], mc = top[1] + mv[1];
          grid[top[0] + mv[0] / 2][top[1] + mv[1] / 2] = 0;   // 打通中间墙
          grid[mr][mc] = 0;
          stack.push([mr, mc]);
        }
        // 随机拆掉少量内部墙形成环路，降低死路挫败感（仍保持最短路存在）
        var extra = Math.floor(N * N / 45);
        for (var k = 0; k < extra; k++) {
          var r2 = 1 + 2 * Math.floor(Math.random() * ((N - 3) / 2));
          var c2 = 1 + 2 * Math.floor(Math.random() * ((N - 3) / 2));
          if (grid[r2][c2] === 1) grid[r2][c2] = 0;
        }
        // 起点/终点确保为路
        grid[1][1] = 0;
        grid[N - 2][N - 2] = 0;
      }

      /* ── BFS 最短路径长度（步数对比参考） ── */
      function shortest() {
        var dist = {};
        var q = [[1, 1]];
        dist["1,1"] = 0;
        var dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
        while (q.length) {
          var cur = q.shift();
          if (cur[0] === N - 2 && cur[1] === N - 2) return dist[cur[0] + "," + cur[1]];
          for (var d = 0; d < 4; d++) {
            var nr = cur[0] + dirs[d][0], nc = cur[1] + dirs[d][1];
            var key = nr + "," + nc;
            if (nr >= 0 && nr < N && nc >= 0 && nc < N && grid[nr][nc] === 0 && !(key in dist)) {
              dist[key] = dist[cur[0] + "," + cur[1]] + 1;
              q.push([nr, nc]);
            }
          }
        }
        return -1;
      }
      var minSteps = 0;

      function draw() {
        var size = Math.min(460, Math.floor((window.innerWidth || 460) - 48));
        CELL = Math.floor(size / N);
        var px = CELL * N;
        cv.width = px; cv.height = px;
        ctx.clearRect(0, 0, px, px);
        // 墙
        ctx.fillStyle = "rgba(0,229,255,.30)";
        for (var r = 0; r < N; r++)
          for (var c = 0; c < N; c++)
            if (grid[r][c] === 1) ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
        // 足迹
        ctx.fillStyle = "rgba(0,229,255,.14)";
        for (var key in trail) {
          var t = trail[key].split(",");
          ctx.fillRect(t[1] * CELL + 1, t[0] * CELL + 1, CELL - 2, CELL - 2);
        }
        // 终点
        ctx.fillStyle = "#ff2fb9";
        ctx.shadowColor = "#ff2fb9"; ctx.shadowBlur = 10;
        ctx.fillRect((N - 2) * CELL + 2, (N - 2) * CELL + 2, CELL - 4, CELL - 4);
        // 玩家
        ctx.fillStyle = "#00e5ff";
        ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(pc * CELL + CELL / 2, pr * CELL + CELL / 2, Math.max(4, CELL * 0.32), 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function tick() {
        elTime.textContent = ((Date.now() - startTime) / 1000).toFixed(1);
      }

      function win() {
        playing = false;
        clearInterval(timerId);
        var t = ((Date.now() - startTime) / 1000).toFixed(1);
        elTime.textContent = t;
        try {
          var b = parseInt(localStorage.getItem(bestKey()) || "99999", 10);
          if (moves < b) localStorage.setItem(bestKey(), String(moves));
        } catch (e) {}
        loadBest();
        elMsg.textContent = "🎉 到达终点！步数 " + moves + "（最短 " + minSteps + "）· 用时 " + t + " 秒。点击「新迷宫」再来一局。";
        elMsg.className = "win";
      }

      function move(dr, dc) {
        if (!playing) return;
        var nr = pr + dr, nc = pc + dc;
        if (nr < 0 || nr >= N || nc < 0 || nc >= N || grid[nr][nc] === 1) return;
        pr = nr; pc = nc;
        moves++;
        elMoves.textContent = moves;
        trail[pr + "," + pc] = 1;
        draw();
        if (pr === N - 2 && pc === N - 2) win();
      }

      function start() {
        generate();
        pr = 1; pc = 1;
        moves = 0;
        trail = { "1,1": 1 };
        minSteps = shortest();
        elMoves.textContent = "0";
        elTime.textContent = "0.0";
        elMsg.textContent = "";
        elMsg.className = "";
        playing = true;
        startTime = Date.now();
        clearInterval(timerId);
        timerId = setInterval(tick, 100);
        loadBest();
        draw();
      }

      document.addEventListener("keydown", function (ev) {
        var map = {
          ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1],
          w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1]
        };
        var m = map[ev.key] || map[ev.key.toLowerCase && ev.key.toLowerCase()];
        if (m) { ev.preventDefault(); move(m[0], m[1]); }
      });

      // 触屏滑动
      var tx = null, ty = null;
      cv.addEventListener("pointerdown", function (ev) {
        tx = ev.clientX; ty = ev.clientY;
      });
      cv.addEventListener("pointerup", function (ev) {
        if (tx === null) return;
        var dx = ev.clientX - tx, dy = ev.clientY - ty;
        if (Math.abs(dx) < 18 && Math.abs(dy) < 18) { tx = null; return; }
        if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1);
        else move(dy > 0 ? 1 : -1, 0);
        tx = null;
      });

      window.addEventListener("resize", function () { if (grid.length) draw(); });

      document.querySelectorAll(".diff button").forEach(function (b) {
        b.addEventListener("click", function () {
          document.querySelectorAll(".diff button").forEach(function (x) { x.classList.remove("on"); });
          b.classList.add("on");
          N = parseInt(b.dataset.n, 10);
          start();
        });
      });

      document.getElementById("btnNew").addEventListener("click", start);

      start();
    })();
  </script>
</body>
