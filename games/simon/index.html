<style>
  :root { --bg:#0b0e1a; --panel:#161b3a; --text:#e8ecff; --muted:#9aa3c7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  header { width:100%; padding:14px 20px; text-align:center; }
  header a { color:var(--muted); text-decoration:none; font-size:.9rem; }
  h1 { font-size:1.3rem; margin:6px 0; }
  .hud { display:flex; gap:20px; margin:8px 0 14px; font-variant-numeric:tabular-nums; }
  .hud b { color:#00e5ff; }
  .simon { display:grid; grid-template-columns:repeat(2,120px); grid-template-rows:repeat(2,120px); gap:14px; margin-bottom:14px; }
  .pad { border-radius:18px; opacity:.45; cursor:pointer; transition:opacity .12s, box-shadow .12s; border:none; }
  .pad.lit { opacity:1; }
  .pad.c0 { background:#00e5ff; } .pad.c0.lit { box-shadow:0 0 26px #00e5ff; }
  .pad.c1 { background:#ff2e88; } .pad.c1.lit { box-shadow:0 0 26px #ff2e88; }
  .pad.c2 { background:#36f1cd; } .pad.c2.lit { box-shadow:0 0 26px #36f1cd; }
  .pad.c3 { background:#ffd166; } .pad.c3.lit { box-shadow:0 0 26px #ffd166; }
  .controls { margin:6px 0 24px; display:flex; gap:10px; }
  button { background:var(--panel); color:var(--text); border:1px solid rgba(255,255,255,.12); padding:9px 18px; border-radius:999px; cursor:pointer; font-size:.95rem; }
  button:hover { border-color:#00e5ff; }
  .hint { color:var(--muted); font-size:.85rem; margin-bottom:24px; text-align:center; }
</style>

<body>
<header>
  <a href="/">← 返回合集</a>
  <h1>🔴 西蒙记忆 Simon</h1>
</header>
<div class="hud">
  <div>轮次 <b id="round">0</b></div>
  <div>最高 <b id="best">0</b></div>
</div>
<div class="simon" id="simon">
  <button class="pad c0" data-i="0"></button>
  <button class="pad c1" data-i="1"></button>
  <button class="pad c2" data-i="2"></button>
  <button class="pad c3" data-i="3"></button>
</div>
<div class="controls">
  <button id="start">开始</button>
</div>
<p class="hint">记住亮起与发声的顺序，依次点击复述 · 每轮增加一步</p>

<script>
(function () {
  'use strict';
  var pads = Array.prototype.slice.call(document.querySelectorAll('.pad'));
  var roundEl = document.getElementById('round'), bestEl = document.getElementById('best');
  var BEST_KEY = 'h5hub_simon_best';
  bestEl.textContent = localStorage.getItem(BEST_KEY) || 0;

  var FREQ = [329.6, 261.6, 392.0, 523.3];
  var seq = [], input = [], playing = false, accept = false, audio = null;

  function ac() { if (!audio) audio = new (window.AudioContext||window.webkitAudioContext)(); return audio; }

  function tone(i, dur) {
    var a = ac(); var o = a.createOscillator(), g = a.createGain();
    o.type='sine'; o.frequency.value=FREQ[i];
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, a.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+(dur||0.35));
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(dur||0.35));
  }

  function light(i, dur) {
    pads[i].classList.add('lit'); tone(i, dur||0.35);
    setTimeout(function(){ pads[i].classList.remove('lit'); }, (dur||0.35)*1000);
  }

  function playSeq() {
    playing = true; accept = false; input = [];
    seq.forEach(function (s, idx) {
      setTimeout(function(){ light(s, 0.4); }, 600*(idx+1));
    });
    setTimeout(function(){ playing=false; accept=true; }, 600*(seq.length+1));
  }

  function nextRound() {
    seq.push((Math.random()*4)|0);
    roundEl.textContent = seq.length;
    playSeq();
  }

  function start() {
    if (ac().state==='suspended') ac().resume();
    seq = []; input = []; playing=false; accept=false; roundEl.textContent=0;
    nextRound();
  }

  function onPad(i) {
    if (!accept || playing) return;
    light(i, 0.25); input.push(i);
    var k = input.length - 1;
    if (input[k] !== seq[k]) return gameOver();
    if (input.length === seq.length) {
      accept = false;
      var best = Math.max(seq.length, +(localStorage.getItem(BEST_KEY)||0));
      localStorage.setItem(BEST_KEY, best); bestEl.textContent = best;
      setTimeout(nextRound, 700);
    }
  }

  function gameOver() {
    accept = false; playing = false;
    var best = Math.max(seq.length-1, +(localStorage.getItem(BEST_KEY)||0));
    localStorage.setItem(BEST_KEY, best); bestEl.textContent = best;
    setTimeout(function(){ alert('记错了！你坚持到了第 ' + (seq.length-1) + ' 轮'); }, 60);
  }

  pads.forEach(function (p){ p.addEventListener('click', function(){ onPad(+p.dataset.i); }); });
  document.getElementById('start').addEventListener('click', start);
})();
</script>
</body>
