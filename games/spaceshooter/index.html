<style>
  :root { --bg:#0b0e1a; --panel:#161b3a; --grid:#1c2247; --neon:#00e5ff; --neon2:#ff2e88; --text:#e8ecff; --muted:#9aa3c7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  header { width:100%; padding:14px 20px; text-align:center; }
  header a { color:var(--muted); text-decoration:none; font-size:.9rem; }
  h1 { font-size:1.3rem; margin:6px 0; }
  .hud { display:flex; gap:20px; margin:8px 0; font-variant-numeric:tabular-nums; }
  .hud b { color:var(--neon); }
  canvas { background:var(--grid); border-radius:12px; touch-action:none; max-width:94vw; height:auto; box-shadow:0 6px 30px rgba(0,0,0,.4); }
  .controls { margin:14px 0; display:flex; gap:10px; }
  button { background:var(--panel); color:var(--text); border:1px solid rgba(255,255,255,.12); padding:9px 18px; border-radius:999px; cursor:pointer; font-size:.95rem; }
  button:hover { border-color:var(--neon); }
  .hint { color:var(--muted); font-size:.85rem; margin-bottom:24px; text-align:center; }
</style>

<body>
<header>
  <a href="/">← 返回合集</a>
  <h1>🚀 太空射击 Space Shooter</h1>
</header>
<div class="hud">
  <div>得分 <b id="score">0</b></div>
  <div>最高 <b id="best">0</b></div>
  <div>生命 <b id="lives">3</b></div>
</div>
<canvas id="game" width="360" height="540"></canvas>
<div class="controls">
  <button id="start">开始</button>
  <button id="restart">重开</button>
</div>
<p class="hint">桌面：← → 移动，空格射击 · 手机：拖动飞船，自动射击</p>

<script>
(function () {
  'use strict';
  var canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  var W=canvas.width, H=canvas.height;
  var scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'), livesEl=document.getElementById('lives');
  var BEST_KEY='h5hub_shooter_best';
  bestEl.textContent=localStorage.getItem(BEST_KEY)||0;

  var player, bullets, enemies, score, lives, running, raf, spawnT, shootT, last;
  var BW=6, BH=14, EW=26, EH=22;

  function reset(){
    player={ x:W/2-16, y:H-50, w:32, h:24, speed:6 };
    bullets=[]; enemies=[]; score=0; lives=3; spawnT=0; shootT=0; last=0; running=false; updateHud(); draw();
  }
  function updateHud(){ scoreEl.textContent=score; livesEl.textContent=lives; bestEl.textContent=Math.max(score,+bestEl.textContent); }

  function spawnEnemy(){
    var x=20+Math.random()*(W-40);
    enemies.push({ x:x, y:-EH, w:EW, h:EH, vy:1.6+Math.random()*1.2, vx:(Math.random()-0.5)*1.2, phase:Math.random()*6.28, amp:0.6+Math.random() });
  }

  function loop(ts){
    if(!running) return;
    if(!last) last=ts; var dt=Math.min(40, ts-last); last=ts;
    // 射击（自动）
    shootT+=dt; if(shootT>220){ shootT=0; bullets.push({x:player.x+player.w/2-BW/2, y:player.y, vy:-9}); }
    // 生成敌机
    spawnT+=dt; if(spawnT>900){ spawnT=0; spawnEnemy(); }
    // 子弹
    for(var i=bullets.length-1;i>=0;i--){ var b=bullets[i]; b.y+=b.vy*dt/16; if(b.y<-BH) bullets.splice(i,1); }
    // 敌机
    for(var j=enemies.length-1;j>=0;j--){ var e=enemies[j]; e.phase+=dt/600*e.amp; e.y+=e.vy*dt/16; e.x+=Math.sin(e.phase)*e.vx; if(e.x<0)e.x=0; if(e.x>W-EW)e.x=W-EW;
      if(e.y>H){ enemies.splice(j,1); loseLife(); if(!running) return; continue; }
    }
    // 碰撞 子弹-敌机
    for(var a=bullets.length-1;a>=0;a--){ for(var c=enemies.length-1;c>=0;c--){ var e=enemies[c], b=bullets[a];
      if(b.x<b.x+e.w && b.x+BW>e.x && b.y<b.y+e.h && b.y+BH>e.y){ bullets.splice(a,1); enemies.splice(c,1); score+=50; updateHud(); break; } } }
    // 碰撞 敌机-玩家
    for(var d=enemies.length-1;d>=0;d--){ var en=enemies[d];
      if(en.x<player.x+player.w && en.x+en.w>player.x && en.y<player.y+player.h && en.y+en.h>player.y){ enemies.splice(d,1); loseLife(); if(!running) return; } }

    draw();
    if(running) raf=requestAnimationFrame(loop);
  }

  function loseLife(){ lives--; updateHud(); if(lives<=0) gameOver(); }

  function draw(){
    ctx.fillStyle='#1c2247'; ctx.fillRect(0,0,W,H);
    // 星点背景
    ctx.fillStyle='rgba(0,229,255,.25)';
    for(var s=0;s<24;s++){ var sx=(s*53)%W, sy=(s*97+ (Date.now()/40)%H)%H; ctx.fillRect(sx,sy,2,2); }
    // 玩家
    ctx.fillStyle='#00e5ff'; ctx.beginPath(); ctx.moveTo(player.x+player.w/2,player.y); ctx.lineTo(player.x,player.y+player.h); ctx.lineTo(player.x+player.w,player.y+player.h); ctx.closePath(); ctx.fill();
    // 子弹
    ctx.fillStyle='#ffd166'; bullets.forEach(function(b){ ctx.fillRect(b.x,b.y,BW,BH); });
    // 敌机
    ctx.fillStyle='#ff2e88'; enemies.forEach(function(e){ ctx.fillRect(e.x,e.y,e.w,e.h); });
  }

  function gameOver(){ running=false; cancelAnimationFrame(raf); var best=Math.max(score,+(localStorage.getItem(BEST_KEY)||0)); localStorage.setItem(BEST_KEY,best); bestEl.textContent=best; setTimeout(function(){ alert('游戏结束！得分：'+score); },30); }

  function start(){ if(running) return; if(lives<=0) reset(); running=true; last=0; raf=requestAnimationFrame(loop); }
  function toggle(){ start(); }

  document.getElementById('start').addEventListener('click', toggle);
  document.getElementById('restart').addEventListener('click', function(){ reset(); });
  document.addEventListener('keydown', function(e){
    if(!running) { if(e.key===' '||e.key==='Enter'){ e.preventDefault(); start(); } return; }
    if(e.key==='ArrowLeft') player.x=Math.max(0,player.x-player.speed);
    else if(e.key==='ArrowRight') player.x=Math.min(W-player.w,player.x+player.speed);
    else if(e.key===' ') e.preventDefault();
  });
  canvas.addEventListener('touchmove', function(e){ var r=canvas.getBoundingClientRect(); var x=e.touches[0].clientX; var px=(x-r.left)*(W/r.width)-player.w/2; player.x=Math.max(0,Math.min(W-player.w,px)); e.preventDefault(); }, {passive:false});

  reset();
})();
</script>
</body>
