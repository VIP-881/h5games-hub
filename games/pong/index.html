  <style>
    :root {
      --bg: #0b0e1a;
      --panel: #121629;
      --neon: #00e5ff;
      --neon2: #ff2fb9;
      --text: #e6f1ff;
      --muted: #8b9bb4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(1200px 600px at 50% -10%, #16204a 0%, var(--bg) 60%);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    a.back { color: var(--neon); text-decoration: none; font-size: 14px; align-self: flex-start; margin-bottom: 12px; }
    a.back:hover { text-decoration: underline; }
    h1 { font-size: 26px; letter-spacing: 2px; text-shadow: 0 0 12px rgba(0, 229, 255, .6); }
    .sub { color: var(--muted); font-size: 13px; margin: 6px 0 18px; }
    .hud {
      display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
      margin-bottom: 16px; font-size: 14px;
    }
    .hud span {
      background: var(--panel); border: 1px solid rgba(0, 229, 255, .25);
      border-radius: 8px; padding: 6px 12px;
    }
    .hud b { color: var(--neon); }
    .diff { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
    .diff button { min-width: 64px; padding: 6px 0; font-size: 14px; letter-spacing: 0; }
    .diff button.on { background: var(--neon); color: #04121a; }
    #court {
      background: var(--panel);
      border: 1px solid rgba(0, 229, 255, .35);
      border-radius: 14px;
      box-shadow: 0 0 24px rgba(0, 229, 255, .18), inset 0 0 12px rgba(0, 0, 0, .5);
      display: block;
      touch-action: none;
      max-width: 100%;
    }
    .controls { display: flex; gap: 12px; margin-top: 18px; }
    button {
      background: transparent; color: var(--neon);
      border: 1px solid var(--neon); border-radius: 8px;

    #msg {
      margin-top: 16px; min-height: 24px; font-size: 15px;

    }
    #msg.win { color: #58ffb1; text-shadow: 0 0 10px rgba(88, 255, 177, .5); }

<body>
  <a class="back" href="/">← 返回游戏合集</a>
  <h1>🏓 Pong 弹球对战</h1>
  <p class="sub">W/S 或 ↑/↓ 移动挡板（手机拖动屏幕）· 先得 7 分获胜 · 球越打越快</p>

  <div class="hud">
    <span>你 <b id="ps">0</b></span>
    <span>AI <b id="as">0</b></span>
    <span>最高连胜 <b id="streak">0</b></span>
  </div>

  <div class="diff" role="group" aria-label="选择 AI 难度">
    <span>难度：</span>
    <button data-d="0">简单</button>
    <button data-d="1" class="on">普通</button>
    <button data-d="2">困难</button>
  </div>

  <canvas id="court" width="640" height="400" aria-label="Pong 球场"></canvas>

  <div class="controls">
    <button id="btnStart">开始 / 重新开始</button>
  </div>

  <div id="msg" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";
      var W = 640, H = 400;
      var PAD_H = 72, PAD_W = 10, TARGET = 7;
      var cv = document.getElementById("court");
      var ctx = cv.getContext("2d");
      var elPs = document.getElementById("ps");
      var elAs = document.getElementById("as");
      var elStreak = document.getElementById("streak");
      var elMsg = document.getElementById("msg");

      var diffIdx = 1;                       // 0 简单 1 普通 2 困难
      var DIFF = [
        { speed: 3.4, err: 46 },             // AI 追球速度 / 瞄准误差
        { speed: 4.6, err: 26 },
        { speed: 6.0, err: 10 }
      ];

      var py = H / 2 - PAD_H / 2;            // 玩家挡板 y
      var ay = H / 2 - PAD_H / 2;            // AI 挡板 y
      var ball = { x: W / 2, y: H / 2, vx: 4, vy: 2, r: 7 };
      var ps = 0, as = 0, streak = 0, run = 0;
      var playing = false, keys = {}, aiTarget = H / 2;

      function loadStreak() {
        try { streak = parseInt(localStorage.getItem("pong_streak") || "0", 10) || 0; } catch (e) { streak = 0; }
        elStreak.textContent = streak;
      }

      function serve(dir) {                  // dir: 1 球飞向 AI，-1 飞向玩家
        ball.x = W / 2; ball.y = H / 2;
        var sp = 4 + diffIdx * 0.6;
        var ang = (Math.random() * 0.8 - 0.4);   // ±0.4 弧度
        ball.vx = dir * sp * Math.cos(ang);
        ball.vy = sp * Math.sin(ang) || 2;
      }

      function draw() {
        // 场地
        ctx.clearRect(0, 0, W, H);
        ctx.strokeStyle = "rgba(0,229,255,.35)";
        ctx.setLineDash([8, 12]);
        ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
        ctx.setLineDash([]);

        // 挡板
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#00e5ff";
        ctx.fillStyle = "#00e5ff";
        ctx.fillRect(18, py, PAD_W, PAD_H);
        ctx.shadowColor = "#ff2fb9";
        ctx.fillStyle = "#ff2fb9";
        ctx.fillRect(W - 18 - PAD_W, ay, PAD_W, PAD_H);

        // 球
        ctx.shadowColor = "#ffffff";
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();

        // 比分
        ctx.shadowBlur = 0;
        ctx.font = "bold 34px monospace";
        ctx.fillStyle = "rgba(230,241,255,.35)";
        ctx.textAlign = "center";
        ctx.fillText(ps, W / 2 - 50, 48);
        ctx.fillText(as, W / 2 + 50, 48);
      }

      function point(who) {
        if (who === "p") ps++; else { as++; }
        elPs.textContent = ps;
        elAs.textContent = as;
        if (ps >= TARGET || as >= TARGET) {
          playing = false;
          if (ps >= TARGET) {
            run++;
            if (run > streak) {
              streak = run;
              try { localStorage.setItem("pong_streak", String(streak)); } catch (e) {}
              elStreak.textContent = streak;
            }
            elMsg.textContent = "🎉 你赢了 " + ps + ":" + as + "！连胜 " + run + " 局。点击「开始」再来一局。";
          } else {
            run = 0;
            elMsg.textContent = "💥 AI 以 " + as + ":" + ps + " 获胜。调整难度再战！";
          }
          elMsg.className = ps >= TARGET ? "win" : "";
          return;
        }
        serve(who === "p" ? 1 : -1);       // 得分方发球？——失分方接发，球飞向失分方
      }

      function step() {
        if (playing) {
          // 玩家挡板
          var sp = 6;
          if (keys.ArrowUp || keys.w) py -= sp;
          if (keys.ArrowDown || keys.s) py += sp;
          py = Math.max(0, Math.min(H - PAD_H, py));

          // AI：平滑追踪目标（带误差），越界回中
          aiTarget += (DIFF[diffIdx].err / 60) * (Math.random() - 0.5);
          aiTarget = Math.max(0, Math.min(H - PAD_H, aiTarget));
          var dy = (aiTarget + PAD_H / 2) - (ball.y);
          var dir = Math.sign(dy);
          var cap = Math.abs(dy) > DIFF[diffIdx].speed ? DIFF[diffIdx].speed : Math.abs(dy);
          if (ball.vx > 0) ay += dir * cap;
          else ay += (H / 2 - PAD_H / 2 - ay) * 0.08;
          ay = Math.max(0, Math.min(H - PAD_H, ay));

          // 球
          ball.x += ball.vx; ball.y += ball.vy;
          if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = -ball.vy; }
          if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.vy = -ball.vy; }

          // 玩家挡板碰撞
          if (ball.vx < 0 && ball.x - ball.r < 18 + PAD_W && ball.x - ball.r > 8 &&
              ball.y > py - 6 && ball.y < py + PAD_H + 6) {
            ball.x = 18 + PAD_W + ball.r;
            var off = (ball.y - (py + PAD_H / 2)) / (PAD_H / 2);   // -1..1 击点偏移
            var spd = Math.min(Math.abs(ball.vx) * 1.06 + 0.2, 12);
            var ang2 = off * 0.9;
            ball.vx = spd * Math.cos(ang2);
            ball.vy = spd * Math.sin(ang2);
          }
          // AI 挡板碰撞
          if (ball.vx > 0 && ball.x + ball.r > W - 18 - PAD_W && ball.x + ball.r < W - 8 &&
              ball.y > ay - 6 && ball.y < ay + PAD_H + 6) {
            ball.x = W - 18 - PAD_W - ball.r;
            var off2 = (ball.y - (ay + PAD_H / 2)) / (PAD_H / 2);
            var spd2 = Math.min(Math.abs(ball.vx) * 1.06 + 0.2, 12);
            var ang3 = Math.PI - off2 * 0.9;
            ball.vx = spd2 * Math.cos(ang3);
            ball.vy = spd2 * Math.sin(-ang3) * -1;
          }

          // 出界得分
          if (ball.x < -10) point("a");
          else if (ball.x > W + 10) point("p");
        }
        draw();
        requestAnimationFrame(step);
      }

      function start() {
        ps = 0; as = 0;
        py = H / 2 - PAD_H / 2;
        ay = H / 2 - PAD_H / 2;
        elPs.textContent = "0";
        elAs.textContent = "0";
        elMsg.textContent = "";
        elMsg.className = "";
        playing = true;
        serve(Math.random() < 0.5 ? 1 : -1);
      }

      document.addEventListener("keydown", function (ev) {
        keys[ev.key] = true;
        if (["ArrowUp", "ArrowDown"].indexOf(ev.key) >= 0) ev.preventDefault();
      });
      document.addEventListener("keyup", function (ev) { keys[ev.key] = false; });

      // 触摸/鼠标拖动控制挡板
      function pointerY(ev) {
        var rect = cv.getBoundingClientRect();
        var y = (ev.touches ? ev.touches[0].clientY : ev.clientY) - rect.top;
        return y * (H / rect.height);
      }
      cv.addEventListener("pointerdown", function (ev) { py = pointerY(ev) - PAD_H / 2; ev.preventDefault(); });
      cv.addEventListener("pointermove", function (ev) {
        if (ev.buttons || ev.pointerType === "touch") py = pointerY(ev) - PAD_H / 2;
      });

      document.querySelectorAll(".diff button").forEach(function (b) {
        b.addEventListener("click", function () {
          document.querySelectorAll(".diff button").forEach(function (x) { x.classList.remove("on"); });
          b.classList.add("on");
          diffIdx = parseInt(b.dataset.d, 10);
        });
      });

      document.getElementById("btnStart").addEventListener("click", start);

      loadStreak();
      start();
      step();
    })();
  </script>
</body>
</html>
