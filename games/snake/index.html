<meta name="description" content="纯前端贪吃蛇小游戏：方向键或 WASD 控制，支持触屏滑动，最高分本地保存。" />

<style>
  :root { --bg:#0b0e1a; --panel:#161b3a; --grid:#1c2247; --snake:#00e5ff; --food:#ff2e88; --text:#e8ecff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  header { width:100%; padding:14px 20px; text-align:center; }
  header a { color:#9aa3c7; text-decoration:none; font-size:.9rem; }
  h1 { font-size:1.3rem; margin:6px 0; }
  .hud { display:flex; gap:20px; margin:8px 0; font-variant-numeric:tabular-nums; }
  .hud b { color:var(--snake); }
  canvas { background:var(--grid); border-radius:12px; touch-action:none; max-width:92vw; height:auto; box-shadow:0 6px 30px rgba(0,0,0,.4); }
  .controls { margin:14px 0; display:flex; gap:10px; }
  button { background:var(--panel); color:var(--text); border:1px solid rgba(255,255,255,.12); padding:9px 18px; border-radius:999px; cursor:pointer; font-size:.95rem; }
  button:hover { border-color:var(--snake); }
  .hint { color:#9aa3c7; font-size:.85rem; margin-bottom:24px; text-align:center; }
</style>
</head>
<body>
<header>
  <a href="/">← 返回合集</a>
  <h1>🐍 贪吃蛇 Snake</h1>
</header>
<div class="hud">
  <div>得分 <b id="score">0</b></div>
  <div>最高 <b id="best">0</b></div>
  <div>关卡 <b id="level">1</b></div>
</div>
<canvas id="game" width="400" height="400"></canvas>
<div class="controls">
  <button id="start">开始 / 暂停</button>
  <button id="restart">重开</button>
</div>
<p class="hint">桌面：方向键 / WASD 移动，空格暂停 · 手机：滑动屏幕控制方向</p>

<script>
(function () {
  'use strict';
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var CELL = 20, COLS = canvas.width / CELL, ROWS = canvas.height / CELL;
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var levelEl = document.getElementById('level');

  var snake, dir, nextDir, food, score, level, speed, timer, running;

  var BEST_KEY = 'h5hub_snake_best';
  bestEl.textContent = localStorage.getItem(BEST_KEY) || 0;

  function reset() {
    snake = [{x:8,y:10},{x:7,y:10},{x:6,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; level = 1; speed = 140;
    placeFood();
    updateHud();
  }

  function placeFood() {
    do {
      food = { x: (Math.random()*COLS)|0, y: (Math.random()*ROWS)|0 };
    } while (snake.some(function (s) { return s.x===food.x && s.y===food.y; }));
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = Math.max(score, +bestEl.textContent);
    levelEl.textContent = level;
  }

  function step() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    // 撞墙或撞自身
    if (head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS ||
        snake.some(function (s){ return s.x===head.x && s.y===head.y; })) {
      return gameOver();
    }
    snake.unshift(head);
    if (head.x===food.x && head.y===food.y) {
      score += 10;
      if (score % 50 === 0) { level++; speed = Math.max(60, speed-12); restartTimer(); }
      placeFood();
    } else {
      snake.pop();
    }
    updateHud();
    draw();
  }

  function draw() {
    ctx.fillStyle = '#1c2247';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#ff2e88';
    ctx.fillRect(food.x*CELL+3, food.y*CELL+3, CELL-6, CELL-6);
    ctx.fillStyle = '#00e5ff';
    snake.forEach(function (s, i) {
      ctx.globalAlpha = i===0 ? 1 : 0.75;
      ctx.fillRect(s.x*CELL+2, s.y*CELL+2, CELL-4, CELL-4);
    });
    ctx.globalAlpha = 1;
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    var best = Math.max(score, +(localStorage.getItem(BEST_KEY)||0));
    localStorage.setItem(BEST_KEY, best);
    bestEl.textContent = best;
    setTimeout(function(){ alert('游戏结束！得分：' + score); }, 30);
  }

  function restartTimer() {
    clearInterval(timer);
    if (running) timer = setInterval(step, speed);
  }

  function toggle() {
    running = !running;
    if (running) timer = setInterval(step, speed);
    else clearInterval(timer);
  }

  document.getElementById('start').addEventListener('click', toggle);
  document.getElementById('restart').addEventListener('click', function(){ reset(); draw(); });

  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k===' '){ e.preventDefault(); toggle(); return; }
    if ((k==='arrowup'||k==='w') && dir.y===0) nextDir={x:0,y:-1};
    else if ((k==='arrowdown'||k==='s') && dir.y===0) nextDir={x:0,y:1};
    else if ((k==='arrowleft'||k==='a') && dir.x===0) nextDir={x:-1,y:0};
    else if ((k==='arrowright'||k==='d') && dir.x===0) nextDir={x:1,y:0};
  });

  var touchStart = null;
  canvas.addEventListener('touchstart', function(e){ touchStart = e.touches[0]; }, {passive:true});
  canvas.addEventListener('touchend', function(e){
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.clientX, dy = t.clientY - touchStart.clientY;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx>0 && dir.x===0) nextDir={x:1,y:0}; else if (dx<0 && dir.x===0) nextDir={x:-1,y:0};
    } else {
      if (dy>0 && dir.y===0) nextDir={x:0,y:1}; else if (dy<0 && dir.y===0) nextDir={x:0,y:-1};
    }
    touchStart = null;
  }, {passive:true});

  reset(); draw();
})();
</script>
</body>
